---
analyzer:
  skip_excluded: true
excludes:
  scopes:
    - pattern: "test"
      reason: "TEST_DEPENDENCY_OF"
      comment: "Test-only dependencies are not released with the plugin."
    - pattern: "provided"
      reason: "PROVIDED_DEPENDENCY_OF"
      comment: "Provided dependencies come from Maven itself at runtime."
